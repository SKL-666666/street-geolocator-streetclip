<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 设计令牌（8pt 栅格 + 指定色板，中性为主 1 主色） */
    :root {
      --bg: #F7F8FA; --card: #FFFFFF; --text: #1F2329; --text2: #646A73;
      --border: #E5E6EB; --primary: #3370FF; --primary-hover: #245BDB;
      --danger: #E5484D; --ok: #00B42A;
      --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px;
      --r: 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1A1D21; --card:#23262B; --text:#E8EAED; --text2:#9AA0A6; --border:#33373D; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg);
      overflow: hidden;
    }
    /* ==== 顶部：标题 + 全局操作 ==== */
    .top {
      display: flex; align-items: center; gap: var(--sp2);
      padding: var(--sp3) var(--sp3); background: var(--card);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .top h1 { font-size: 15px; font-weight: 600; }
    .top .sp { flex: 1; }
    .icobtn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--r); background: var(--card);
      color: var(--text2); cursor: pointer; font-size: 15px; transition: all .15s;
    }
    .icobtn:hover { border-color: var(--primary); color: var(--primary); }
    .icobtn:disabled { opacity: .4; cursor: not-allowed; }

    /* ==== 中部：核心任务区 ==== */
    .main { flex: 1; overflow-y: auto; padding: var(--sp3); min-height: 0; }

    /* 主操作：大、实心、唯一 */
    .primary {
      width: 100%; height: 40px; border: none; border-radius: var(--r); cursor: pointer;
      background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .primary:hover { background: var(--primary-hover); }
    .primary:disabled { opacity: .5; cursor: not-allowed; }

    /* 渐进披露：高级设置折叠 */
    details.settings {
      margin-top: var(--sp3); background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r);
    }
    details.settings summary {
      padding: var(--sp2) var(--sp3); cursor: pointer; font-size: 13px; color: var(--text2);
      list-style: none; user-select: none;
    }
    details.settings summary::-webkit-details-marker { display: none; }
    details.settings summary::after { content: '▾'; float: right; transition: transform .15s; }
    details.settings[open] summary::after { transform: rotate(180deg); }
    details.settings .body { padding: 0 var(--sp3) var(--sp3); display: flex; flex-direction: column; gap: var(--sp2); }
    .field { display: flex; flex-direction: column; gap: var(--sp1); }
    .field label { font-size: 12px; color: var(--text2); }
    .field select, .field input {
      height: 32px; padding: 0 var(--sp2); border: 1px solid var(--border); border-radius: var(--r);
      background: var(--bg); color: var(--text); font-size: 13px;
    }
    .seg { display: flex; gap: var(--sp1); }
    .seg button {
      flex: 1; height: 32px; border: 1px solid var(--border); border-radius: var(--r);
      background: var(--card); color: var(--text2); font-size: 12px; cursor: pointer; transition: all .12s;
    }
    .seg button.on { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .seg button:hover:not(.on) { border-color: var(--primary); color: var(--primary); }

    /* 状态条 */
    .status { padding: var(--sp2) var(--sp3); font-size: 12px; color: var(--text2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .status.hide { display: none; }
    .bar { height: 3px; background: var(--border); flex-shrink: 0; }
    .bar.hide { display: none; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }

    /* 结果区 */
    .result { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--card); max-height: 45%; overflow-y: auto; }
    .result.hide { display: none; }
    .res-head { padding: var(--sp2) var(--sp3); font-size: 12px; color: var(--text2); }
    .cand { padding: var(--sp2) var(--sp3); border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: var(--sp2); }
    .cand:last-child { border-bottom: 0; }
    .cand:hover { background: var(--bg); }
    .cand .rank { width: 20px; height: 20px; border-radius: 50%; background: var(--border); color: var(--text2);
      font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cand.top .rank { background: var(--primary); color: #fff; }
    .cand .info { flex: 1; min-width: 0; }
    .cand .city { font-weight: 600; font-size: 13.5px; }
    .cand .country { font-size: 12px; color: var(--text2); }
    .cand .conf { font-size: 12px; color: var(--primary); font-weight: 600; }
    .maplink { display: block; text-align: center; padding: var(--sp2); color: var(--primary);
      font-size: 12.5px; cursor: pointer; text-decoration: none; border-top: 1px solid var(--border); }
    .maplink:hover { text-decoration: underline; }

    /* 预览（最近截图） */
    .shot { margin-top: var(--sp3); border-radius: var(--r); border: 1px solid var(--border); width: 100%; display: none; }
    .shot.show { display: block; }

    /* 空状态 */
    .empty { text-align: center; color: var(--text2); padding: var(--sp5) var(--sp3); font-size: 13px; line-height: 1.8; }
    .empty .ico { font-size: 28px; display: block; margin-bottom: var(--sp2); }

    .err { color: var(--danger); font-size: 12.5px; padding: var(--sp2) var(--sp3);
      background: #FFF1F0; border-radius: var(--r); margin-top: var(--sp2); display: none; }
    .err.show { display: block; }
  </style>
</head>
<body>
  <!-- 顶部：标题 + 全局操作 -->
  <div class="top">
    <h1>街景定位</h1>
    <span class="sp"></span>
    <button id="reload" class="icobtn" title="清空重来">↻</button>
  </div>

  <div id="status" class="status hide"></div>
  <div id="bar" class="bar hide"><i id="barfill"></i></div>

  <!-- 中部：核心任务区 -->
  <div class="main">
    <button id="capture" class="primary">截取当前页并分析</button>

    <!-- 高级设置：折叠（渐进披露） -->
    <details class="settings">
      <summary>更多设置</summary>
      <div class="body">
        <div class="field">
          <label>截图范围</label>
          <div class="seg" id="shotmode">
            <button data-m="visible" class="on">可见区域</button>
            <button data-m="full">整页</button>
            <button data-m="element">选择元素</button>
          </div>
        </div>
        <div class="field">
          <label>分析范围</label>
          <select id="scope">
            <option value="world">全世界</option>
            <option value="no-cn">除中国大陆</option>
            <option value="cn">中国模式</option>
          </select>
        </div>
        <div class="field">
          <label>城市引擎</label>
          <select id="engine">
            <option value="clip">本地模型</option>
            <option value="llm">云端 LLM</option>
          </select>
        </div>
      </div>
    </details>

    <img id="shot" class="shot" alt="" />
    <div id="error" class="err"></div>
  </div>

  <!-- 结果区（底部，独立渲染，不依赖网页） -->
  <div id="result" class="result hide"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
