<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #ffffff; --bg-subtle: #f5f7fa; --text: #1f2937; --muted: #6b7280;
      --border: #e5e7eb; --primary: #4f83e0; --primary-hover: #3b6fd4; --danger: #e8615e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --bg-subtle: #0d1526; --text: #eef4fb; --muted: #a8bcd6;
        --border: #2a3f63; --primary: #3b82f6; --primary-hover: #60a5fa; --danger: #f87171;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); font-size: 13px;
    }
    /* 顶部工具条 */
    .bar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg-subtle); flex-shrink: 0;
    }
    .bar .title { font-weight: 700; font-size: 13px; margin-right: auto; white-space: nowrap; }
    .btn {
      padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer;
      background: var(--primary); color: #fff; font-size: 12px; font-weight: 600;
      white-space: nowrap; transition: background .15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost:hover { background: var(--border); }
    /* 状态条 */
    .status {
      padding: 6px 10px; font-size: 11.5px; color: var(--muted);
      border-bottom: 1px solid var(--border); flex-shrink: 0; display: none;
    }
    .status.show { display: block; }
    .progress { height: 3px; background: var(--border); flex-shrink: 0; display: none; }
    .progress.show { display: block; }
    .pfill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #3b82f6); transition: width .2s linear; }
    .err { padding: 8px 10px; color: var(--danger); font-size: 12px; flex-shrink: 0; display: none; }
    .err.show { display: block; }
    /* 主区域：iframe 承载完整界面（地图/候选/纠错） */
    .frame-wrap { flex: 1; position: relative; min-height: 0; }
    #app-frame { width: 100%; height: 100%; border: 0; display: block; }
    .placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; text-align: center;
      padding: 24px; color: var(--muted);
    }
    .placeholder.hidden { display: none; }
    .placeholder .big { font-size: 32px; }
    .placeholder .t { font-size: 13px; line-height: 1.7; max-width: 260px; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="title">📍 街景定位</span>
    <button id="capture" class="btn">截取当前页</button>
    <button id="reload" class="btn ghost" title="重新加载界面">↻</button>
  </div>

  <div id="status" class="status"></div>
  <div id="progress" class="progress"><div id="pfill" class="pfill"></div></div>
  <div id="error" class="err"></div>

  <div class="frame-wrap">
    <iframe id="app-frame" src="about:blank"></iframe>
    <div id="placeholder" class="placeholder">
      <div class="big">🌐</div>
      <div class="t">点上方「截取当前页」分析当前网页图像；<br/>或先启动本地服务后重试。</div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
