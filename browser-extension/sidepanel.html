<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <style>
    :root {
      --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --text2:#8E8E93; --text3:#C7C7CC;
      --sep:rgba(60,60,67,.13); --blue:#007AFF; --blue-h:#0A66D6; --green:#34C759; --red:#FF3B30;
      --gray:#E9E9EB; --r:14px; --rc:10px;
    }
    html[data-theme="dark"] {
      --bg:#000; --card:#1C1C1E; --text:#FFFFFF; --text2:#98989F; --text3:#48484A;
      --sep:rgba(84,84,88,.5); --blue:#0A84FF; --gray:#2C2C2E;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
      font-size:15px; line-height:1.4; color:var(--text); background:var(--bg);
      display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased;
    }
    .nav {
      flex-shrink:0; padding:11px 14px 9px; display:flex; align-items:center; gap:8px;
      background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
      border-bottom:.5px solid var(--sep);
    }
    .nav h1 { font-size:19px; font-weight:700; letter-spacing:-.3px; flex:1; }
    .nav-btn {
      width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
      background:var(--gray); color:var(--blue); font-size:15px;
      display:flex; align-items:center; justify-content:center; transition:background .15s;
    }
    .nav-btn:hover { background:color-mix(in srgb, var(--blue) 16%, var(--gray)); }
    .nav-btn:disabled { opacity:.35; cursor:not-allowed; }
    .view { flex:1; overflow-y:auto; padding:12px; display:none; flex-direction:column; gap:12px; min-height:0; }
    .view.on { display:flex; }
    .card { background:var(--card); border-radius:var(--r); overflow:hidden; }
    .pad { padding:14px 16px; }
    .btn-primary {
      width:100%; height:46px; border:none; border-radius:var(--rc); cursor:pointer;
      background:var(--blue); color:#fff; font-size:16px; font-weight:600;
      transition:background .15s,transform .05s; font-family:inherit;
    }
    .btn-primary:hover { background:var(--blue-h); }
    .btn-primary:active { transform:scale(.985); }
    .btn-primary:disabled { opacity:.45; cursor:not-allowed; }
    .btn-sm {
      height:32px; padding:0 12px; border:1px solid var(--sep); border-radius:8px; cursor:pointer;
      background:var(--card); color:var(--blue); font-size:13px; font-family:inherit;
    }
    .btn-sm:hover { background:color-mix(in srgb, var(--blue) 8%, var(--card)); }
    .btn-sm.danger { color:var(--red); }
    .grp { font-size:12px; color:var(--text2); padding:0 4px 6px; text-transform:uppercase; letter-spacing:.4px; font-weight:500; }
    .row { display:flex; align-items:center; gap:10px; padding:12px 16px; min-height:46px; }
    .row + .row { border-top:.5px solid var(--sep); }
    .row .lb { flex:1; font-size:15px; }
    .row.tap { cursor:pointer; }
    .row.tap:hover { background:color-mix(in srgb, var(--blue) 6%, transparent); }
    .row .chev { color:var(--text3); font-size:13px; flex-shrink:0; }
    .seg { display:flex; background:var(--gray); border-radius:9px; padding:2px; gap:2px; }
    .seg button {
      flex:1; height:30px; border:none; border-radius:7px; cursor:pointer; background:transparent;
      color:var(--text); font-size:12.5px; font-weight:500; transition:background .15s; font-family:inherit; white-space:nowrap;
    }
    .seg button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.14); font-weight:600; }
    .dd { position:relative; }
    .dd-btn {
      display:flex; align-items:center; gap:6px; background:transparent; border:none; cursor:pointer;
      color:var(--text2); font-size:15px; font-family:inherit; max-width:150px;
    }
    .dd-btn .tx { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dd-btn .ar { color:var(--text3); font-size:11px; }
    .dd-menu {
      position:absolute; right:0; top:calc(100% + 6px); z-index:50; min-width:180px;
      background:color-mix(in srgb, var(--card) 96%, transparent); border-radius:12px;
      box-shadow:0 8px 30px rgba(0,0,0,.18); padding:6px; display:none;
      backdrop-filter:saturate(180%) blur(20px);
    }
    .dd-menu.show { display:block; }
    .dd-item { padding:9px 12px; border-radius:8px; font-size:14px; cursor:pointer; color:var(--text); display:flex; align-items:center; gap:8px; }
    .dd-item:hover { background:var(--blue); color:#fff; }
    .dd-item.on { font-weight:600; }
    .dd-item .ck { margin-left:auto; font-size:13px; }
    .map-wrap { border-radius:var(--r); overflow:hidden; height:340px; position:relative; background:var(--gray); }
    #map { position:absolute; inset:0; }
    .cand { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; transition:background .12s; }
    .cand + .cand { border-top:.5px solid var(--sep); }
    .cand:hover { background:color-mix(in srgb, var(--blue) 6%, transparent); }
    .cand .num { width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:600;background:var(--gray);color:var(--text2); }
    .cand:first-child .num { background:var(--blue); color:#fff; }
    .cand .info { flex:1; min-width:0; }
    .cand .city { font-size:15px; font-weight:600; }
    .cand .meta { font-size:12.5px; color:var(--text2); margin-top:1px; }
    .cand .conf { font-size:14px; font-weight:600; color:var(--blue); }
    .meta-line { font-size:12.5px; color:var(--text2); line-height:1.65; word-break:break-word; }
    .meta-line + .meta-line { margin-top:6px; }
    .meta-line b { color:var(--text); font-weight:600; }
    .status { flex-shrink:0; padding:8px 14px; font-size:12.5px; color:var(--text2); display:none; }
    .status.show { display:block; }
    .pbar { flex-shrink:0; height:2.5px; background:var(--sep); display:none; }
    .pbar.show { display:block; }
    .pbar > i { display:block;height:100%;width:0;background:var(--blue);transition:width .25s ease; }
    .err { padding:12px 14px; border-radius:var(--rc); background:color-mix(in srgb,var(--red) 12%,transparent);
      color:var(--red); font-size:13px; display:none; line-height:1.5; }
    .err.show { display:block; }
    .empty { text-align:center; padding:44px 20px; color:var(--text2); }
    .empty .ico { font-size:40px; margin-bottom:12px; opacity:.5; }
    .empty .t1 { font-size:16px; font-weight:600; color:var(--text); margin-bottom:4px; }
    .empty .t2 { font-size:13px; line-height:1.6; }
    .shot { width:100%; display:block; }
    .hist { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
    .hist + .hist { border-top:.5px solid var(--sep); }
    .hist:hover { background:color-mix(in srgb, var(--blue) 6%, transparent); }
    .hist .th { width:44px;height:44px;border-radius:9px;background:var(--gray);flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden; }
    .hist .th img { width:100%;height:100%;object-fit:cover; }
    .hist .info { flex:1; min-width:0; }
    .hist .t1 { font-size:14px; font-weight:600; overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .hist .t2 { font-size:12px; color:var(--text2); margin-top:2px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .cfg { display:flex; align-items:center; gap:10px; padding:12px 16px; }
    .cfg + .cfg { border-top:.5px solid var(--sep); }
    .cfg.active { background:color-mix(in srgb, var(--blue) 8%, transparent); }
    .cfg .info { flex:1; min-width:0; }
    .cfg .t1 { font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; }
    .cfg .tag { font-size:10.5px; padding:1px 7px; border-radius:20px; background:var(--blue); color:#fff; }
    .cfg .t2 { font-size:12px; color:var(--text2); margin-top:2px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .field { display:flex;flex-direction:column;gap:6px;padding:10px 16px; }
    .field label { font-size:12.5px; color:var(--text2); }
    .field input {
      height:38px;padding:0 12px;border:.5px solid var(--sep);border-radius:var(--rc);
      background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;
    }
    .field input:focus { outline:2px solid var(--blue); border-color:transparent; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="nav">
    <button id="back" class="nav-btn hidden" title="返回">‹</button>
    <h1 id="navtitle">街景定位</h1>
    <button id="theme" class="nav-btn" title="切换浅色/深色">◐</button>
    <button id="navHistory" class="nav-btn" title="历史记录">🕘</button>
    <button id="navSettings" class="nav-btn" title="设置">⚙</button>
    <button id="reload" class="nav-btn" title="清空重来">↻</button>
  </div>

  <div id="status" class="status"></div>
  <div id="pbar" class="pbar"><i id="pbarfill"></i></div>

  <div class="view on" id="v-home">
    <div id="error" class="err"></div>
    <button id="capture" class="btn-primary">截取当前页并分析</button>
    <div>
      <div class="grp">截图范围</div>
      <div class="seg" id="shotmode">
        <button data-m="visible" class="on">可见区域</button>
        <button data-m="full">整页</button>
        <button data-m="element">选择元素</button>
      </div>
    </div>
    <div class="card" id="shotcard" style="display:none"><img id="shot" class="shot" alt="" /></div>
    <div id="empty" class="card empty">
      <div class="ico">🌍</div>
      <div class="t1">截取网页图片开始定位</div>
      <div class="t2">点上方按钮 → 结果显示地图与 Top3 地点</div>
    </div>
    <div id="mapcard" class="map-wrap hidden"><div id="map"></div></div>
    <div id="resultcard" class="card hidden"><div id="cands"></div></div>
    <div id="infocard" class="card hidden"><div class="pad" id="info"></div></div>
  </div>

  <div class="view" id="v-settings">
    <div>
      <div class="grp">分析</div>
      <div class="card">
        <div class="row"><span class="lb">分析范围</span>
          <div class="dd" data-dd="scope">
            <button class="dd-btn"><span class="tx"></span><span class="ar">▾</span></button>
            <div class="dd-menu">
              <div class="dd-item" data-v="world">全世界</div>
              <div class="dd-item" data-v="no-cn">除中国大陆</div>
              <div class="dd-item" data-v="cn">中国模式</div>
            </div>
          </div>
        </div>
        <div class="row"><span class="lb">国家引擎</span>
          <div class="dd" data-dd="national">
            <button class="dd-btn"><span class="tx"></span><span class="ar">▾</span></button>
            <div class="dd-menu">
              <div class="dd-item" data-v="local">纯本地</div>
              <div class="dd-item" data-v="adaptive">自适应 VLM 复核</div>
            </div>
          </div>
        </div>
        <div class="row"><span class="lb">城市引擎</span>
          <div class="dd" data-dd="engine">
            <button class="dd-btn"><span class="tx"></span><span class="ar">▾</span></button>
            <div class="dd-menu">
              <div class="dd-item" data-v="clip">本地模型</div>
              <div class="dd-item" data-v="llm">云端 LLM</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="grp">外观</div>
      <div class="card">
        <div class="row"><span class="lb">主题</span>
          <div class="dd" data-dd="theme">
            <button class="dd-btn"><span class="tx"></span><span class="ar">▾</span></button>
            <div class="dd-menu">
              <div class="dd-item" data-v="light">浅色</div>
              <div class="dd-item" data-v="dark">深色</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="grp">大模型 API 配置</div>
      <div class="card" id="cfgList"><div class="row"><span class="lb" style="color:var(--text2)">加载中…</span></div></div>
      <div id="cfgErr" class="err" style="margin-top:8px"></div>
    </div>
    <div>
      <div class="grp">添加配置</div>
      <div class="card">
        <div class="field"><label>配置名称</label><input id="cfgName" placeholder="留空则用模型名" /></div>
        <div class="field"><label>API 地址</label><input id="cfgUrl" placeholder="https://api.example.com/v1" /></div>
        <div class="field"><label>API Key</label><input id="cfgKey" type="password" placeholder="粘贴 Key" /></div>
        <div class="field"><label>模型名</label><input id="cfgModel" placeholder="视觉模型名" /></div>
        <div class="pad" style="padding-top:4px"><button id="cfgAdd" class="btn-primary">保存并启用</button></div>
      </div>
      <div id="cfgMsg" class="err" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="view" id="v-history">
    <div id="histList" class="card"><div class="pad" style="color:var(--text2)">加载中…</div></div>
  </div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
